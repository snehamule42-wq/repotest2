name: Extract Data
on:
  push:
    branches:
        - main

jobs:
  extract_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run data extraction script
        run: |
          python extract_data.py